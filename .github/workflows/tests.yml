name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes navigator tests
      - name: Run tests (offline, fake LLM)
        env:
          NAV_LLM: fake
        run: python -m pytest -q
