<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental Housing Law Navigator</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d2433;--muted:#5b6475;--line:#e3e5ea;--accent:#1f5fbf;
--ok:#1b7f4b;--okbg:#e5f4ec;--unk:#8a5a00;--unkbg:#fdf1d8;--sup:#5b6475;--supbg:#eceef2;
--fut:#3d4fb8;--futbg:#e6e9fb;--pen:#7a3db8;--penbg:#f1e7fb;--warn:#b42318;--warnbg:#fdeceb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151b;--card:#1a1f27;--ink:#e7e9ee;--muted:#9aa3b2;
--line:#2b313c;--accent:#7aa7ff;--ok:#6fd39c;--okbg:#173126;--unk:#f2c46b;--unkbg:#3a2e14;--sup:#aab2c0;--supbg:#262c36;
--fut:#9fb0ff;--futbg:#232a4a;--pen:#cfa6f5;--penbg:#2f2340;--warn:#ff8a80;--warnbg:#3b1d1b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:22px 0 10px}h3{font-size:15px;margin:0}
.banner{background:var(--warnbg);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin:16px 0;align-items:end}
@media (max-width:700px){.controls{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
button{cursor:pointer;width:auto}button.on{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--card)}
.facts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.rule{border-top:1px solid var(--line);padding:12px 0 4px}.rule:first-of-type{border-top:0}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;margin-right:6px}
.b-applies{color:var(--ok);background:var(--okbg)}.b-unknown{color:var(--unk);background:var(--unkbg)}
.b-superseded{color:var(--sup);background:var(--supbg)}.b-not_yet_effective{color:var(--fut);background:var(--futbg)}
.b-pending{color:var(--pen);background:var(--penbg)}.b-flag{color:var(--warn);background:var(--warnbg)}
.kv{font-weight:600}details{margin-top:6px}summary{cursor:pointer;color:var(--accent);font-size:13px}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg);font-size:14px}
ul.why{margin:6px 0 0 18px;padding:0;font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.tabs{display:flex;gap:8px;margin-top:12px}footer{margin:30px 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header><div class="wrap" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
  <div><h1 id="t-title">Rental Housing Law Navigator</h1><div class="muted small" id="t-sub"></div></div>
  <div class="tabs"><button id="lang-en" class="on">English</button><button id="lang-es">Español</button></div>
</div></header>
<main class="wrap">
  <div class="tabs"><button id="tab-lookup" class="on"></button><button id="tab-changes"></button></div>
  <section id="view-lookup">
    <div class="controls">
      <div><label for="addr" id="t-addr"></label><input id="addr" list="addr-list" autocomplete="off"><datalist id="addr-list"></datalist></div>
      <div><label for="asof" id="t-asof"></label><input id="asof" type="date"></div>
      <div><label>&nbsp;</label><button id="today"></button></div>
    </div>
    <div id="result"></div>
  </section>
  <section id="view-changes" hidden><div id="changes"></div></section>
  <footer id="foot"></footer>
</main>
<script>
const T={en:{title:"Rental Housing Law Navigator",sub:"Which rules apply to this address, and what is about to change?",
banner:"Informational only. Not legal advice. Every answer links to the law it comes from; check with a lawyer or your local housing agency before acting.",
lookup:"Address lookup",changes:"Law changes",addr:"Address",asof:"Answer as of",today:"Default date",
pick:"Start typing an address from the sample list.",juris:"Jurisdictions",built:"Year built",units:"Units",use:"Use code",
notindata:"not in data",applies:"Applies",unknown:"Unknown — depends on a fact we don't have",superseded:"Superseded by local law",
not_yet_effective:"Not yet in effect",pending:"Pending bill — not law",source:"Show the law",retrieved:"retrieved",why:"Why this result",
conflict:"Possible conflict with",norule:"No rule found in the provided corpus for this category at this address.",
noruleat:"No rule at this level:",upcoming:"Coming up",geolow:"Address matched by postal city only; boundary not verified.",
low:"Low confidence — flagged for human review",review:"Quote could not be verified — flagged for human review",
affected:"Affected addresses",conflicts:"Conflict flags",rules:"Matched rules",notes:"Notes",kv:"Key value",
range:"No data before",foot:"Sources: provided starter-pack corpus. Extraction is automated; see the audit log in the repository for model, prompt version and source hashes."},
es:{title:"Navegador de leyes de vivienda de alquiler",sub:"¿Qué reglas aplican a esta dirección y qué está por cambiar?",
banner:"Solo informativo. No es asesoría legal. Cada respuesta enlaza a la ley de origen; consulte a un abogado o a su agencia de vivienda local antes de actuar.",
lookup:"Buscar dirección",changes:"Cambios de ley",addr:"Dirección",asof:"Respuesta a la fecha",today:"Fecha predeterminada",
pick:"Empiece a escribir una dirección de la lista.",juris:"Jurisdicciones",built:"Año de construcción",units:"Unidades",use:"Código de uso",
notindata:"sin datos",applies:"Aplica",unknown:"Desconocido — depende de un dato que no tenemos",superseded:"Reemplazada por ley local",
not_yet_effective:"Aún no vigente",pending:"Proyecto de ley — no es ley",source:"Ver la ley",retrieved:"consultado",why:"Por qué",
conflict:"Posible conflicto con",norule:"No se encontró ninguna regla en el corpus para esta categoría en esta dirección.",
noruleat:"No hay regla en este nivel:",upcoming:"Próximamente",geolow:"Dirección ubicada solo por ciudad postal; límite no verificado.",
low:"Confianza baja — marcada para revisión humana",review:"No se pudo verificar la cita — marcada para revisión humana",
affected:"Direcciones afectadas",conflicts:"Conflictos",rules:"Reglas",notes:"Notas",kv:"Valor clave",
range:"No hay datos antes de",foot:"Fuentes: corpus del paquete inicial. La extracción es automática; el registro de auditoría muestra modelo, versión de prompt y hashes."}};
let L="en",D=null,cur=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function t(k){return T[L][k]}
function snap(d){let i=-1;D.dates.forEach((x,j)=>{if(x<=d)i=j});return i}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:""}
function texts(){["title","sub","banner"].forEach(k=>$(k==="banner"?"banner":"t-"+k).textContent=t(k));
$("tab-lookup").textContent=t("lookup");$("tab-changes").textContent=t("changes");$("t-addr").textContent=t("addr");
$("t-asof").textContent=t("asof");$("today").textContent=t("today");$("foot").textContent=t("foot");document.documentElement.lang=L}
function render(){texts();if(!cur){$("result").innerHTML=`<p class="muted">${t("pick")}</p>`;renderChanges();return}
const ai=D.addresses.findIndex(a=>a.id===cur),a=D.addresses[ai],di=snap($("asof").value||D.as_of_default);
if(di<0){$("result").innerHTML=`<p class="muted">${t("range")} ${esc(D.dates[0])}.</p>`;renderChanges();return}const rows=D.results[ai][di];
const f=v=>v==null?`<span class="muted">${t("notindata")}</span>`:esc(v);
let h=`<div class="cat"><h3>${esc(a.label)}</h3><div class="chips">${(a.stack_labels||a.stack).map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>
<div class="facts"><span>${t("built")}: ${f(a.facts.year_built)}</span><span>${t("units")}: ${f(a.facts.units)}</span><span>${t("use")}: ${f(a.facts.use_code)}</span></div>
${a.geocode&&a.geocode.confidence==="low"?`<p class="small" style="color:var(--unk)">${t("geolow")}</p>`:""}</div>`;
for(const [cat,labels] of Object.entries(D.categories)){
 const items=rows.filter(r=>D.rules[r[0]].category===cat);const nr=D.no_rule.filter(n=>n.category===cat&&a.no_rule.includes(n.id));
 h+=`<div class="cat"><h3>${esc(labels[L==="en"?0:1])}</h3>`;
 if(!items.length&&!nr.length)h+=`<p class="muted small">${t("norule")}</p>`;
 for(const n of nr)h+=`<div class="rule small"><b>${t("noruleat")}</b> ${esc(n.jurisdiction)} — ${esc(n.explanation)}<details><summary>${t("source")}</summary><blockquote>${esc(n.quote)}</blockquote><div class="muted">${esc(n.citation)}</div></details></div>`;
 for(const [ri,code,why,conf] of items){const r=D.rules[ri],res=D.result_codes[code],s=r.source||{};
  h+=`<div class="rule"><span class="badge b-${res}">${t(res)}</span>${conf.length?`<span class="badge b-flag">${t("conflict")} ${conf.map(i=>esc(i>=0?D.rules[i].citation:"?")).join(", ")}</span>`:""}
  <b>${esc(r.citation)}</b> <span class="muted small">· ${esc(r.jurisdiction)}${r.effective_date?" · "+esc(r.effective_date):""}</span>
  <div>${esc(L==="es"&&r.requirement_es?r.requirement_es:r.requirement)}</div>
  ${r.key_value?`<div class="small">${t("kv")}: <span class="kv">${esc(r.key_value)}</span></div>`:""}
  ${(r.confidence??1)<0.6?`<div class="small" style="color:var(--warn)">${t("low")}</div>`:""}
  ${!s.quote?`<div class="small" style="color:var(--warn)">${t("review")}</div>`:""}
  ${why.length?`<ul class="why">${why.map(i=>`<li>${esc(D.reasons[i])}</li>`).join("")}</ul>`:""}
  ${s.quote?`<details><summary>${t("source")}</summary><blockquote>${esc(s.quote)}</blockquote><div class="muted small">${esc(s.title||s.doc_id)} · ${t("retrieved")} ${esc(s.retrieval_date)} ${safeUrl(s.url)?`· <a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">link</a>`:""} · sha256 ${esc((s.sha256||"").slice(0,12))} · ${esc((r.provenance||{}).prompt_version||"")}</div></details>`:""}</div>`}
 h+=`</div>`}
$("result").innerHTML=h;renderChanges()}
function renderChanges(){if(!D.changes){$("changes").innerHTML="";return}
$("changes").innerHTML=`<h2>${t("changes")}</h2><table><tr><th>Test</th><th>${t("rules")}</th><th>${t("affected")}</th><th>${t("conflicts")}</th><th>${t("notes")}</th></tr>`+
D.changes.tests.map(x=>`<tr><td><b>${esc(x.id)}</b><div class="small muted">${esc(x.title)}</div><div class="small muted">${esc(x.before||"")} → ${esc(x.after||"")}</div></td>
<td class="small">${x.rules.map(r=>esc(r.citation)+" ("+esc(r.status)+")").join("<br>")}</td><td>${x.affected_addresses.length}</td><td>${x.conflicts.length}</td><td class="small">${x.notes.map(esc).join("<br>")}</td></tr>`).join("")+`</table>`}
fetch("data.json").then(r=>r.json()).then(d=>{D=d;$("addr-list").innerHTML=D.addresses.map(a=>`<option value="${esc(a.label)}">`).join("");
$("asof").value=D.as_of_default;
const pick=()=>{const a=D.addresses.find(a=>a.label===$("addr").value||a.id===$("addr").value);if(a){cur=a.id;history.replaceState(null,"","#"+encodeURIComponent(a.id))}render()};
$("addr").addEventListener("change",pick);$("addr").addEventListener("input",pick);$("asof").addEventListener("change",render);
$("today").onclick=()=>{$("asof").value=D.as_of_default;render()};
const fromHash=()=>{const h=decodeURIComponent(location.hash.slice(1));if(h&&D.addresses.some(a=>a.id===h)){cur=h;$("addr").value=D.addresses.find(a=>a.id===h).label}render()};
window.addEventListener("hashchange",fromHash);fromHash()});
for(const l of ["en","es"])$("lang-"+l).onclick=()=>{L=l;$("lang-en").classList.toggle("on",l==="en");$("lang-es").classList.toggle("on",l==="es");render()};
for(const v of ["lookup","changes"])$("tab-"+v).onclick=()=>{["lookup","changes"].forEach(w=>{$("view-"+w).hidden=w!==v;$("tab-"+w).classList.toggle("on",w===v)})};
</script>
</body>
</html>
